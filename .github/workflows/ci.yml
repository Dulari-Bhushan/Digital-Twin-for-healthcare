name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kaya_IIT-Hyderabad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Kaya_IIT-Hyderabad/requirements-api.txt
      - name: Install
        run: pip install -r requirements-api.txt pytest httpx pyarrow
      - name: Test
        run: python -m pytest -q tests

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kaya_IIT-Hyderabad/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Kaya_IIT-Hyderabad/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
